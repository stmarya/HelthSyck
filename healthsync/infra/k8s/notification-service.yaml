apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-service-config
  namespace: healthsync
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  REDIS_URL: "redis://redis:6379"
  KAFKA_BROKERS: "kafka:29092"
  MQTT_BROKER: "tcp://emqx:1883"
  PORT: "3009"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: healthsync
  labels:
    app: notification-service
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
        version: v1
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: notification-service
          image: healthsync/notification-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3009
              protocol: TCP
          envFrom:
            - configMapRef:
                name: notification-service-config
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: healthsync-secrets
                  key: jwt-secret
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: healthsync-secrets
                  key: database-url
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 3009
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3009
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: healthsync
  labels:
    app: notification-service
spec:
  selector:
    app: notification-service
  ports:
    - name: http
      port: 3009
      targetPort: 3009
      protocol: TCP
  type: ClusterIP
