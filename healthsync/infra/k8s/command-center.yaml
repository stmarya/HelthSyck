apiVersion: apps/v1
kind: Deployment
metadata:
  name: command-center
  namespace: healthsync
  labels:
    app: command-center
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: command-center
  template:
    metadata:
      labels:
        app: command-center
        version: v1
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: command-center
          image: ghcr.io/healthsync-indonesia/command-center:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
---
apiVersion: v1
kind: Service
metadata:
  name: command-center
  namespace: healthsync
  labels:
    app: command-center
spec:
  selector:
    app: command-center
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
  type: ClusterIP
