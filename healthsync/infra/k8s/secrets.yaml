apiVersion: v1
kind: Secret
metadata:
  name: healthsync-secrets
  namespace: healthsync
type: Opaque
stringData:
  jwt-secret: "REPLACE_WITH_STRONG_SECRET_IN_PRODUCTION"
  database-url: "postgresql://healthsync:REPLACE_PASSWORD@postgres:5432/healthsync"
  redis-url: "redis://:REPLACE_PASSWORD@redis:6379"
  fcm-server-key: "REPLACE_WITH_FCM_SERVER_KEY"
  satusehat-client-id: "REPLACE_WITH_SATUSEHAT_CLIENT_ID"
  satusehat-client-secret: "REPLACE_WITH_SATUSEHAT_CLIENT_SECRET"
  bpjs-consumer-id: "REPLACE_WITH_BPJS_CONSUMER_ID"
  bpjs-consumer-secret: "REPLACE_WITH_BPJS_CONSUMER_SECRET"
