apiVersion: v1
kind: ConfigMap
metadata:
  name: ambulance-service-config
  namespace: healthsync
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  REDIS_URL: "redis://redis:6379"
  KAFKA_BROKERS: "kafka:29092"
  MQTT_BROKER: "tcp://emqx:1883"
  PORT: "3005"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ambulance-service
  namespace: healthsync
  labels:
    app: ambulance-service
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ambulance-service
  template:
    metadata:
      labels:
        app: ambulance-service
        version: v1
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: ambulance-service
          image: healthsync/ambulance-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3005
              protocol: TCP
          envFrom:
            - configMapRef:
                name: ambulance-service-config
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: healthsync-secrets
                  key: jwt-secret
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: healthsync-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: healthsync-secrets
                  key: redis-url
            - name: CORS_ORIGINS
              valueFrom:
                secretKeyRef:
                  name: healthsync-secrets
                  key: cors-origins
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 3005
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3005
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
---
apiVersion: v1
kind: Service
metadata:
  name: ambulance-service
  namespace: healthsync
  labels:
    app: ambulance-service
spec:
  selector:
    app: ambulance-service
  ports:
    - name: http
      port: 3005
      targetPort: 3005
      protocol: TCP
  type: ClusterIP
