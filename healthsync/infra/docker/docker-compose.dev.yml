      context: ../..
      dockerfile: services/consultation-service/Dockerfile
    container_name: hs-consultation
    <<: *service-defaults
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      NODE_ENV: ${NODE_ENV}
      LOG_LEVEL: ${LOG_LEVEL}
      KAFKA_BROKERS: ${KAFKA_BROKERS}
      KAFKA_TOPIC_VITALS: ${KAFKA_TOPIC_VITALS}
      KAFKA_TOPIC_ALERTS: ${KAFKA_TOPIC_ALERTS}
      PORT: ${CONSULTATION_PORT:-3003}
    ports:
      - "${CONSULTATION_PORT:-3003}:3003"
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3003/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s

  prescription-service:
    build:
      context: ../..
      dockerfile: services/prescription-service/Dockerfile
    container_name: hs-prescription
    <<: *service-defaults
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      NODE_ENV: ${NODE_ENV}
      LOG_LEVEL: ${LOG_LEVEL}
      KAFKA_BROKERS: ${KAFKA_BROKERS}
      KAFKA_TOPIC_VITALS: ${KAFKA_TOPIC_VITALS}
      KAFKA_TOPIC_ALERTS: ${KAFKA_TOPIC_ALERTS}
      PORT: ${PRESCRIPTION_PORT:-3004}
    ports:
      - "${PRESCRIPTION_PORT:-3004}:3004"
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3004/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s

  ambulance-service:
    build:
      context: ../..
      dockerfile: services/ambulance-service/Dockerfile
    container_name: hs-ambulance
    <<: *service-defaults
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      NODE_ENV: ${NODE_ENV}
      LOG_LEVEL: ${LOG_LEVEL}
      KAFKA_BROKERS: ${KAFKA_BROKERS}
      KAFKA_TOPIC_VITALS: ${KAFKA_TOPIC_VITALS}
      KAFKA_TOPIC_ALERTS: ${KAFKA_TOPIC_ALERTS}
      PORT: ${AMBULANCE_PORT:-3005}
    ports:
      - "${AMBULANCE_PORT:-3005}:3005"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3005/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s

  referral-service:
    build:
      context: ../..
      dockerfile: services/referral-service/Dockerfile
    container_name: hs-referral
    <<: *service-defaults
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      NODE_ENV: ${NODE_ENV}
      LOG_LEVEL: ${LOG_LEVEL}
      PORT: ${REFERRAL_PORT:-3006}
    ports:
      - "${REFERRAL_PORT:-3006}:3006"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3006/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s

  hospital-service:
    build:
      context: ../..
      dockerfile: services/hospital-service/Dockerfile
    container_name: hs-hospital
    <<: *service-defaults
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      NODE_ENV: ${NODE_ENV}
      LOG_LEVEL: ${LOG_LEVEL}
      PORT: ${HOSPITAL_PORT:-3007}
    ports:
      - "${HOSPITAL_PORT:-3007}:3007"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3007/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s

  pharmacy-service:
    build:
      context: ../..
      dockerfile: services/pharmacy-service/Dockerfile
    container_name: hs-pharmacy
    <<: *service-defaults
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      NODE_ENV: ${NODE_ENV}
      LOG_LEVEL: ${LOG_LEVEL}
      PORT: ${PHARMACY_PORT:-3008}
    ports:
      - "${PHARMACY_PORT:-3008}:3008"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3008/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s

  notification-service:
    build:
      context: ../..
      dockerfile: services/notification-service/Dockerfile
    container_name: hs-notification
    <<: *service-defaults
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      NODE_ENV: ${NODE_ENV}
      LOG_LEVEL: ${LOG_LEVEL}
      KAFKA_BROKERS: ${KAFKA_BROKERS}
      KAFKA_TOPIC_VITALS: ${KAFKA_TOPIC_VITALS}
      KAFKA_TOPIC_ALERTS: ${KAFKA_TOPIC_ALERTS}
      PORT: ${NOTIFICATION_PORT:-3009}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      FCM_CLIENT_EMAIL: ${FCM_CLIENT_EMAIL:-}
      FCM_PRIVATE_KEY: ${FCM_PRIVATE_KEY:-}
      SMS_API_KEY: ${SMS_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-noreply@healthsync.local}
      SMTP_PASS: ${SMTP_PASS:-}
    ports:
      - "${NOTIFICATION_PORT:-3009}:3009"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mailhog:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3009/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s

  integration-service:
    build:
      context: ../..
      dockerfile: services/integration-service/Dockerfile
    container_name: hs-integration
    <<: *service-defaults
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      NODE_ENV: ${NODE_ENV}
      LOG_LEVEL: ${LOG_LEVEL}
      PORT: ${INTEGRATION_PORT:-3010}
      SATUSEHAT_BASE_URL: ${SATUSEHAT_BASE_URL:-https://api-satusehat.kemkes.go.id}
      SATUSEHAT_CLIENT_ID: ${SATUSEHAT_CLIENT_ID:-dev-client-id}
      SATUSEHAT_CLIENT_SECRET: ${SATUSEHAT_CLIENT_SECRET:-dev-client-secret}
      SATUSEHAT_ORGANIZATION_ID: ${SATUSEHAT_ORGANIZATION_ID:-dev-org-id}
      BPJS_BASE_URL: ${BPJS_BASE_URL:-https://apijkn.bpjs-kesehatan.go.id}
      BPJS_CONS_ID: ${BPJS_CONS_ID:-dev-cons-id}
      BPJS_SECRET_KEY: ${BPJS_SECRET_KEY:-dev-secret-key}
      BPJS_USER_KEY: ${BPJS_USER_KEY:-dev-user-key}
    ports:
      - "${INTEGRATION_PORT:-3010}:3010"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3010/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ═══════════════════════════════════════════════════════════════
