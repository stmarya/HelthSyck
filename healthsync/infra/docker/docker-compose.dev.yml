# ══════════════════════════════════════════════════════════════════
#  HealthSync — Development Docker Compose
#
#  Usage (from repo root / healthsync/ directory):
#    docker compose -f infra/docker/docker-compose.dev.yml \
#                   --env-file infra/docker/.env.dev up -d
#
#  Services start order:
#    1. postgres (TimescaleDB) + redis + emqx + zookeeper + kafka
#    2. migrate  (run V001–V007 SQL migrations, then exit)
#    3. All application services (depend on migrate completing)
#    4. mailhog  (local SMTP catcher, no credentials needed)
# ══════════════════════════════════════════════════════════════════

networks:
  healthsync-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  emqx_data:
  emqx_log:
  kafka_data:
  zookeeper_data:
  zookeeper_log:

# ─────────────────────────────────────────────────────────────────
# Shared service defaults anchor (restart + network only)
# ─────────────────────────────────────────────────────────────────
x-service-defaults: &service-defaults
  restart: unless-stopped
  networks:
    - healthsync-network

services:

  # ═══════════════════════════════════════════════════════════════
  # INFRASTRUCTURE
  # ═══════════════════════════════════════════════════════════════

  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: hs-postgres
    <<: *service-defaults
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: hs-redis
    <<: *service-defaults
    command: redis-server --save 60 1 --loglevel warning --requirepass ""
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  emqx:
    image: emqx/emqx:5.8
    container_name: hs-emqx
    <<: *service-defaults
    environment:
      EMQX_NAME: healthsync-emqx
      EMQX_HOST: 0.0.0.0
      EMQX_ALLOW_ANONYMOUS: "true"
    ports:
      - "1883:1883"    # MQTT
      - "8083:8083"    # MQTT over WebSocket
      - "18083:18083"  # EMQX Dashboard (admin/public)
    volumes:
      - emqx_data:/opt/emqx/data
      - emqx_log:/opt/emqx/log
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: hs-zookeeper
    <<: *service-defaults
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | timeout 2 bash -c 'cat > /dev/tcp/localhost/2181' && echo ok || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: hs-kafka
    <<: *service-defaults
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CREATE_TOPICS: "hs.vitals.ingested:3:1,hs.alert.triggered:3:1,hs.notifications:3:1"
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ─────────────────────────────────────────────────────────────
  # MailHog — local SMTP catcher (view emails at localhost:8025)
  # ─────────────────────────────────────────────────────────────
  mailhog:
    image: mailhog/mailhog:latest
    container_name: hs-mailhog
    <<: *service-defaults
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI

  # ═══════════════════════════════════════════════════════════════
  # MIGRATION RUNNER
  # ═══════════════════════════════════════════════════════════════
  migrate:
    image: postgres:15-alpine
    container_name: hs-migrate
    networks:
      - healthsync-network
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ../../infra/db/migrations:/migrations:ro
    command: >
      sh -c "
        echo '=== HealthSync DB Migration Runner ===' &&
        psql $$DATABASE_URL -c \"CREATE TABLE IF NOT EXISTS schema_migrations (version VARCHAR(255) PRIMARY KEY, applied_at TIMESTAMPTZ NOT NULL DEFAULT NOW());\" &&
        for f in /migrations/V*.sql; do
          v=$$(basename $$f .sql);
          applied=$$(psql $$DATABASE_URL -t -c \"SELECT COUNT(*) FROM schema_migrations WHERE version='$$v';\" | tr -d ' ');
          if [ \"$$applied\" = \"1\" ]; then
            echo \"  ✓ $$v (already applied)\";
          else
            echo \"  → Applying $$v...\";
            psql $$DATABASE_URL -f $$f && psql $$DATABASE_URL -c \"INSERT INTO schema_migrations (version) VALUES ('$$v');\" && echo \"  ✓ $$v done\";
          fi;
        done &&
        echo '=== All migrations complete ==='
      "
    restart: "no"

  # ═══════════════════════════════════════════════════════════════
  # NODE.JS APPLICATION SERVICES
  # All env vars are listed explicitly (no double-anchor YAML trick)
  # ═══════════════════════════════════════════════════════════════

  auth-service:
    build:
      context: ../..
      dockerfile: services/auth-service/Dockerfile
    container_name: hs-auth
    <<: *service-defaults
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      NODE_ENV: ${NODE_ENV}
      LOG_LEVEL: ${LOG_LEVEL}
      PORT: ${AUTH_PORT:-3001}
    ports:
      - "${AUTH_PORT:-3001}:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s

  patient-service:
    build:
      context: ../..
      dockerfile: services/patient-service/Dockerfile
    container_name: hs-patient
    <<: *service-defaults
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      NODE_ENV: ${NODE_ENV}
      LOG_LEVEL: ${LOG_LEVEL}
      PORT: ${PATIENT_PORT:-3002}
    ports:
      - "${PATIENT_PORT:-3002}:3002"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3002/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s

  consultation-service:
