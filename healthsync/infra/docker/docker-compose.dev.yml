  # ═══════════════════════════════════════════════════════════════

  iot-ingestion:
    build:
      context: ../..
      dockerfile: services/iot-ingestion/Dockerfile
    container_name: hs-iot-ingestion
    <<: *service-defaults
    environment:
      PORT: ${IOT_PORT:-4001}
      DATABASE_URL: ${DATABASE_URL}
      KAFKA_BROKERS: ${KAFKA_BROKERS}
      KAFKA_TOPIC_VITALS: ${KAFKA_TOPIC_VITALS}
      MQTT_BROKER: ${MQTT_BROKER}
      MQTT_CLIENT_ID: ${MQTT_CLIENT_ID:-iot-ingestion-01}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${IOT_PORT:-4001}:4001"
    depends_on:
      kafka:
        condition: service_healthy
      emqx:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4001/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s

  alert-service:
    build:
      context: ../..
      dockerfile: services/alert-service/Dockerfile
    container_name: hs-alert
    <<: *service-defaults
    environment:
      PORT: ${ALERT_PORT:-4002}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      KAFKA_BROKERS: ${KAFKA_BROKERS}
      KAFKA_TOPIC_VITALS: ${KAFKA_TOPIC_VITALS}
      KAFKA_TOPIC_ALERTS: ${KAFKA_TOPIC_ALERTS}
      KAFKA_GROUP_ID: ${KAFKA_GROUP_ID_ALERT:-alert-service-group}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${ALERT_PORT:-4002}:4002"
    depends_on:
      kafka:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4002/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ═══════════════════════════════════════════════════════════════
  # SWAGGER UI — serves OpenAPI docs at http://localhost:4010/docs
  # ═══════════════════════════════════════════════════════════════

  swagger-ui:
    image: node:20-alpine
    container_name: hs-swagger-ui
    <<: *service-defaults
    working_dir: /app
    command: ["node", "server.js"]
    volumes:
      - ../../tools/swagger-ui:/app:ro
      - ../../docs:/docs:ro
    environment:
      PORT: 4010
      OPENAPI_SPEC_PATH: /docs/openapi.yaml
    ports:
      - "4010:4010"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4010/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ═══════════════════════════════════════════════════════════════
  # FRONTEND APPS (Vite dev servers)
  # ═══════════════════════════════════════════════════════════════

  command-center:
    build:
      context: ../..
      dockerfile: apps/command-center/Dockerfile
    container_name: hs-command-center
    <<: *service-defaults
    environment:
      # VITE_*_TARGET — target proxy server-side (nama service Docker)
      VITE_AUTH_TARGET:         http://auth-service:3001
      VITE_PATIENT_TARGET:      http://patient-service:3002
      VITE_CONSULTATION_TARGET: http://consultation-service:3003
      VITE_PRESCRIPTION_TARGET: http://prescription-service:3004
      VITE_AMBULANCE_TARGET:    http://ambulance-service:3005
      VITE_REFERRAL_TARGET:     http://referral-service:3006
      VITE_HOSPITAL_TARGET:     http://hospital-service:3007
      VITE_PHARMACY_TARGET:     http://pharmacy-service:3008
      VITE_NOTIFICATION_TARGET: http://notification-service:3009
      VITE_IOT_TARGET:          http://iot-ingestion:4001
      VITE_ALERT_TARGET:        http://alert-service:4002
    ports:
      - "5173:5173"
    depends_on:
      auth-service:
        condition: service_healthy

  admin:
    build:
      context: ../..
      dockerfile: apps/admin/Dockerfile
    container_name: hs-admin
    <<: *service-defaults
    environment:
      # VITE_*_TARGET — server-side proxy targets (Docker service names, not localhost)
      VITE_AUTH_TARGET:         http://auth-service:3001
      VITE_PATIENT_TARGET:      http://patient-service:3002
      VITE_CONSULTATION_TARGET: http://consultation-service:3003
      VITE_PRESCRIPTION_TARGET: http://prescription-service:3004
      VITE_AMBULANCE_TARGET:    http://ambulance-service:3005
      VITE_REFERRAL_TARGET:     http://referral-service:3006
      VITE_HOSPITAL_TARGET:     http://hospital-service:3007
      VITE_PHARMACY_TARGET:     http://pharmacy-service:3008
      VITE_NOTIFICATION_TARGET: http://notification-service:3009
      VITE_INTEGRATION_TARGET:  http://integration-service:3010
      VITE_IOT_TARGET:          http://iot-ingestion:4001
      VITE_ALERT_TARGET:        http://alert-service:4002
    volumes:
      # Bind-mount source so Vite hot-reload sees local code changes
      - ../../apps/admin/src:/app/apps/admin/src:ro
      - ../../apps/admin/vite.config.ts:/app/apps/admin/vite.config.ts:ro
      - ../../apps/admin/index.html:/app/apps/admin/index.html:ro
    ports:
      - "5174:5174"
    depends_on:
      auth-service:
        condition: service_healthy
