worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # -------------------------------------------------------------------------
    # Logging
    # -------------------------------------------------------------------------
    log_format json_structured escape=json
        '{'
            '"request_id":"$http_x_request_id",'
            '"remote_addr":"$remote_addr",'
            '"method":"$request_method",'
            '"uri":"$request_uri",'
            '"status":$status,'
            '"body_bytes":$body_bytes_sent,'
            '"request_time":$request_time,'
            '"upstream_response_time":"$upstream_response_time"'
        '}';

    access_log /var/log/nginx/access.log json_structured;
    error_log  /var/log/nginx/error.log warn;

    # -------------------------------------------------------------------------
    # GZIP compression
    # -------------------------------------------------------------------------
    gzip on;
    gzip_types application/json;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;

    # -------------------------------------------------------------------------
    # Rate limiting
    # -------------------------------------------------------------------------
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;

    # -------------------------------------------------------------------------
    # Upstreams
    # -------------------------------------------------------------------------
    upstream upstream_auth {
        server auth-service:3001;
        keepalive 32;
    }

    upstream upstream_patient {
        server patient-service:3002;
        keepalive 32;
    }

    upstream upstream_consultation {
        server consultation-service:3003;
        keepalive 32;
    }

    upstream upstream_prescription {
        server prescription-service:3004;
        keepalive 32;
    }

    upstream upstream_ambulance {
        server ambulance-service:3005;
        keepalive 32;
    }

    upstream upstream_referral {
        server referral-service:3006;
        keepalive 32;
    }

    upstream upstream_hospital {
        server hospital-service:3007;
        keepalive 32;
    }

    upstream upstream_pharmacy {
        server pharmacy-service:3008;
        keepalive 32;
    }

    upstream upstream_notification {
        server notification-service:3009;
        keepalive 32;
    }

    upstream upstream_integration {
        server integration-service:3010;
        keepalive 32;
    }

    upstream upstream_iot {
        server iot-ingestion:4001;
        keepalive 32;
    }

    upstream upstream_alert {
        server alert-service:4002;
        keepalive 32;
    }

    upstream upstream_swagger {
        server swagger-ui:4010;
        keepalive 32;
    }

    # -------------------------------------------------------------------------
    # Server
    # -------------------------------------------------------------------------
    server {
        listen 80;
        server_name _;

        # ---------------------------------------------------------------------
        # Security headers
        # ---------------------------------------------------------------------
        add_header X-Frame-Options           "DENY"                                      always;
        add_header X-Content-Type-Options    "nosniff"                                   always;
        add_header X-XSS-Protection          "1; mode=block"                             always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains"       always;
        add_header Content-Security-Policy   "default-src 'self'"                        always;

        # ---------------------------------------------------------------------
        # CORS — api.healthsync.id
        # ---------------------------------------------------------------------
        set $cors_origin "";
        if ($http_origin = "https://api.healthsync.id") {
            set $cors_origin $http_origin;
        }

        add_header Access-Control-Allow-Origin      $cors_origin       always;
        add_header Access-Control-Allow-Methods     "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers     "Authorization, Content-Type, X-Request-ID" always;
        add_header Access-Control-Allow-Credentials "true"             always;
        add_header Access-Control-Max-Age           "86400"            always;

        # Handle pre-flight requests
        if ($request_method = OPTIONS) {
            return 204;
        }

        # ---------------------------------------------------------------------
        # Rate limiting
        # ---------------------------------------------------------------------
        limit_req zone=api_limit burst=200 nodelay;

        # ---------------------------------------------------------------------
        # Common proxy settings (shared defaults)
        # ---------------------------------------------------------------------
        proxy_http_version      1.1;
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_set_header        X-Request-ID      $http_x_request_id;
        proxy_set_header        Connection        "";
        proxy_pass_header       X-Request-ID;

        proxy_connect_timeout   5s;
        proxy_send_timeout      60s;
        proxy_read_timeout      60s;

        # ---------------------------------------------------------------------
        # Health check — answered directly by nginx
        # ---------------------------------------------------------------------
        location = /health {
            access_log off;
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json;
        }

        # Service health checks used by the Admin dashboard. The browser-facing
        # aliases are rewritten to each service's canonical /health endpoint.
        location = /health/auth {
            proxy_pass http://upstream_auth/health;
        }
        location = /health/patient {
            proxy_pass http://upstream_patient/health;
        }
        location = /health/consultation {
            proxy_pass http://upstream_consultation/health;
        }
        location = /health/prescription {
            proxy_pass http://upstream_prescription/health;
        }
        location = /health/ambulance {
            proxy_pass http://upstream_ambulance/health;
        }
        location = /health/referral {
            proxy_pass http://upstream_referral/health;
        }
        location = /health/hospital {
            proxy_pass http://upstream_hospital/health;
        }
        location = /health/pharmacy {
            proxy_pass http://upstream_pharmacy/health;
        }
        location = /health/notification {
            proxy_pass http://upstream_notification/health;
        }
        location = /health/integration {
            proxy_pass http://upstream_integration/health;
        }
        location = /health/iot {
            proxy_pass http://upstream_iot/health;
        }
        location = /health/alert {
            proxy_pass http://upstream_alert/health;
        }

        # ---------------------------------------------------------------------
        # API routes
        # ---------------------------------------------------------------------
        # Keep the complete /v1/... path. Every service registers its routes
        # with that prefix; stripping it here would turn /v1/auth/login into
        # /login and produce a production-only 404.
        location ~ ^/v1/auth(/.*)?$ {
            proxy_pass http://upstream_auth;
        }

        location ~ ^/v1/patients(/.*)?$ {
            proxy_pass http://upstream_patient;
        }

        location ~ ^/v1/consultations(/.*)?$ {
            proxy_pass http://upstream_consultation;
        }

        location ~ ^/v1/prescriptions(/.*)?$ {
            proxy_pass http://upstream_prescription;
        }

        location ~ ^/v1/ambulances(/.*)?$ {
            proxy_pass http://upstream_ambulance;
        }

        location ~ ^/v1/referrals(/.*)?$ {
            proxy_pass http://upstream_referral;
        }

        location ~ ^/v1/hospitals(/.*)?$ {
            proxy_pass http://upstream_hospital;
        }

        location ~ ^/v1/doctors(/.*)?$ {
            proxy_pass http://upstream_hospital;
        }

        location ~ ^/v1/pharmacies(/.*)?$ {
            proxy_pass http://upstream_pharmacy;
        }

        location ~ ^/v1/drugs(/.*)?$ {
            proxy_pass http://upstream_pharmacy;
        }

        location ~ ^/v1/notifications(/.*)?$ {
            proxy_pass http://upstream_notification;
        }

        location ~ ^/v1/integrations(/.*)?$ {
            proxy_pass http://upstream_integration;
        }

        location ~ ^/v1/iot(/.*)?$ {
            proxy_pass http://upstream_iot;
        }

        location ~ ^/v1/alerts(/.*)?$ {
            proxy_pass http://upstream_alert;
        }

        location ~ ^/v1/admin(/.*)?$ {
            proxy_pass http://upstream_auth;
        }

        # ---------------------------------------------------------------------
        # Swagger / docs
        # ---------------------------------------------------------------------
        location ~ ^/docs(/.*)?$ {
            proxy_pass http://upstream_swagger$1$is_args$args;
        }

        # ---------------------------------------------------------------------
        # Catch-all
        # ---------------------------------------------------------------------
        location / {
            return 404 '{"error":"not_found"}';
            add_header Content-Type application/json;
        }
    }
}
