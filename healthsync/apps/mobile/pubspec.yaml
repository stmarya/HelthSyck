name: healthsync_mobile
description: HealthSync Indonesia — Mobile Health Application
version: 1.0.0+1

environment:
  sdk: ">=3.1.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^13.0.0

  # State management (Riverpod)
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # HTTP client
  http: ^1.1.0

  # WebSocket / MQTT for real-time vitals
  mqtt_client: ^10.2.1
  web_socket_channel: ^2.4.0

  # Secure storage for tokens
  flutter_secure_storage: ^9.0.0

  # Local notifications (alerts)
  flutter_local_notifications: ^16.3.0

  # Charts for vitals display
  fl_chart: ^0.68.0

  # Date/time utilities
  intl: ^0.19.0

  # Environment config
  flutter_dotenv: ^5.1.0

  # Freezed models
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1

  # Logging
  logger: ^2.3.0

  # Connectivity
  connectivity_plus: ^5.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.7
  freezed: ^2.5.2
  json_serializable: ^6.7.1
  riverpod_generator: ^2.4.0
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.10

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
    # .env dibaca oleh flutter_dotenv saat runtime.
    # Salin .env.example → .env sebelum flutter run:
    #   cp apps/mobile/.env.example apps/mobile/.env
    - .env.example
