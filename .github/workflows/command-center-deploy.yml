name: Deploy Command Center

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        type: choice
        options: [staging, production]
      map_provider:
        description: Live map provider; simulator is allowed only for staging
        required: true
        default: simulator
        type: choice
        options: [simulator, maplibre, mapbox, google]

permissions:
  contents: read
  packages: write

env:
  IMAGE_REGISTRY: ghcr.io
  IMAGE_OWNER: healthsync-indonesia
  NAMESPACE: healthsync

jobs:
  deploy:
    name: Build and deploy Command Center
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reject simulator for production
        if: ${{ inputs.environment == 'production' && inputs.map_provider == 'simulator' }}
        run: |
          echo "Production deployment cannot use simulator map mode."
          exit 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Command Center image
        uses: docker/build-push-action@v5
        with:
          context: healthsync
          file: healthsync/apps/command-center/Dockerfile.prod
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/command-center:${{ github.sha }}
            ghcr.io/${{ env.IMAGE_OWNER }}/command-center:${{ inputs.environment }}

      - name: Build and push realtime image
        uses: docker/build-push-action@v5
        with:
          context: healthsync
          file: healthsync/services/realtime-service/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/realtime-service:${{ github.sha }}
            ghcr.io/${{ env.IMAGE_OWNER }}/realtime-service:${{ inputs.environment }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Configure kubeconfig
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          test -n "$KUBE_CONFIG_DATA"
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBE_CONFIG_DATA" | base64 --decode > "$HOME/.kube/config"
          kubectl cluster-info

      - name: Apply Command Center runtime configuration
        env:
          MAP_ACCESS_TOKEN: ${{ secrets.VITE_MAP_ACCESS_TOKEN }}
          TURN_CREDENTIAL: ${{ secrets.VITE_TURN_CREDENTIAL }}
        run: |
          kubectl -n "$NAMESPACE" create configmap command-center-config \
            --from-literal=VITE_MAP_PROVIDER='${{ inputs.map_provider }}' \
            --from-literal=VITE_MAP_STYLE_URL='${{ secrets.VITE_MAP_STYLE_URL }}' \
            --from-literal=VITE_ROUTING_URL='${{ secrets.VITE_ROUTING_URL }}' \
            --from-literal=VITE_LOCATION_STALE_AFTER_MS='15000' \
            --from-literal=VITE_TURN_URL='${{ secrets.VITE_TURN_URL }}' \
            --from-literal=VITE_TURN_USERNAME='${{ secrets.VITE_TURN_USERNAME }}' \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n "$NAMESPACE" create secret generic command-center-runtime \
            --from-literal=VITE_MAP_ACCESS_TOKEN="$MAP_ACCESS_TOKEN" \
            --from-literal=VITE_TURN_CREDENTIAL="$TURN_CREDENTIAL" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply manifests
        run: |
          kubectl apply -f healthsync/infra/k8s/command-center.yaml
          kubectl apply -f healthsync/infra/k8s/realtime-service.yaml
          kubectl apply -f healthsync/infra/k8s/command-center-ingress.yaml
          kubectl -n "$NAMESPACE" set image deployment/command-center command-center="ghcr.io/${{ env.IMAGE_OWNER }}/command-center:${{ github.sha }}"
          kubectl -n "$NAMESPACE" set image deployment/realtime-service realtime-service="ghcr.io/${{ env.IMAGE_OWNER }}/realtime-service:${{ github.sha }}"

      - name: Wait for rollout
        run: |
          kubectl -n "$NAMESPACE" rollout status deployment/command-center --timeout=180s
          kubectl -n "$NAMESPACE" rollout status deployment/realtime-service --timeout=180s
          kubectl -n "$NAMESPACE" get pods,svc,ingress -l app=command-center
