name: HealthSync Admin Validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/healthsync-admin.yml'
      - 'healthsync/package-lock.json'
      - 'healthsync/package.json'
      - 'healthsync/packages/shared/**'
      - 'healthsync/apps/admin/**'
      - 'healthsync/services/auth-service/**'
      - 'healthsync/services/consultation-service/**'
      - 'healthsync/services/hospital-service/**'
      - 'healthsync/services/patient-service/**'
      - 'healthsync/services/ambulance-service/**'
      - 'healthsync/services/referral-service/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/healthsync-admin.yml'
      - 'healthsync/package-lock.json'
      - 'healthsync/package.json'
      - 'healthsync/packages/shared/**'
      - 'healthsync/apps/admin/**'
      - 'healthsync/services/auth-service/**'
      - 'healthsync/services/consultation-service/**'
      - 'healthsync/services/hospital-service/**'
      - 'healthsync/services/patient-service/**'
      - 'healthsync/services/ambulance-service/**'
      - 'healthsync/services/referral-service/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  DATABASE_URL: ******localhost:5432/healthsync_test
  JWT_SECRET: ci-test-secret-do-not-use-in-production
  REDIS_URL: redis://localhost:6379
  PORT: '0'
  NODE_ENV: test

jobs:
  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: healthsync
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: healthsync/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm exec --workspace=packages/shared -- tsc --project tsconfig.json

      - name: Admin typecheck
        run: npm exec --workspace=apps/admin -- tsc --noEmit

      - name: Admin lint
        run: npm exec --workspace=apps/admin -- eslint src --ext ts,tsx --max-warnings 0

      - name: Admin build
        run: npm exec --workspace=apps/admin -- vite build

  services:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace:
          - services/auth-service
          - services/consultation-service
          - services/hospital-service
          - services/patient-service
          - services/ambulance-service
          - services/referral-service
    defaults:
      run:
        working-directory: healthsync
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: healthsync/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm exec --workspace=packages/shared -- tsc --project tsconfig.json

      - name: Service typecheck
        run: npx tsc --project ${{ matrix.workspace }}/tsconfig.json --noEmit

      - name: Service tests
        run: npm exec --workspace=${{ matrix.workspace }} -- jest --passWithNoTests --forceExit
