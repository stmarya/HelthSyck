name: Mobile quality

on:
  push:
    paths:
      - "healthsync/apps/mobile/**"
      - ".github/workflows/mobile-quality.yml"
  pull_request:
    paths:
      - "healthsync/apps/mobile/**"
      - ".github/workflows/mobile-quality.yml"

jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: healthsync/apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug